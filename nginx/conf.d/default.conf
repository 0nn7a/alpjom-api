# http 層設定:限流用的計數區(conf.d 檔案是被 include 在 http{} 內,放這裡即可)
server_tokens off;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name alpjom.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name alpjom.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/alpjom.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alpjom.duckdns.org/privkey.pem;

    # 擋掉常見掃描副檔名(Java 應用不供 php/asp 等)
    location ~* \.(php|asp|aspx|cgi|sh|bak)$ {
        return 444;
    }

    # 擋隱藏檔(.env / .git 等),放行 .well-known
    location ~ /\.(?!well-known) {
        return 444;
    }

    location / {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
